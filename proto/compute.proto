syntax = "proto3";

package diffuse.compute;

message Hop {
  string compute_endpoint = 1;
  bytes kx_public = 2;
  uint32 start_layer = 3;
  uint32 end_layer = 4;
  uint32 top_k = 5;
  bool accepts_bf16 = 6;
}

message ComputeRequest {
  bytes requester_kx_public = 1;
  string model_id = 2;
  uint32 start_layer = 3;
  uint32 end_layer = 4;
  string session_id = 5;
  bytes encrypted_activations = 6;
  uint32 top_k = 7;
  repeated Hop route = 8;
  bool accepts_bf16 = 9;
  bytes encrypted_position_ids = 10;
  bytes encrypted_encoder_memory = 11;
  uint64 patch_offset = 12;
  uint64 patch_sequence = 13;
  string branch = 14;
  string layout = 15;
  bytes encrypted_arguments = 16;
  float guidance = 17;
  bool sample = 18;
  float temperature = 19;
  uint64 seed = 20;
  float top_p = 21;
}

message ComputeResponse {
  bytes encrypted_activations = 1;
  bool ok = 2;
  string error = 3;
  uint64 compute_ms = 4;
  uint32 protocol_version = 5;
}

service Compute {
  rpc RunSlice(ComputeRequest) returns (ComputeResponse);
  rpc ClearSession(ClearSessionRequest) returns (ClearSessionResponse);
}

message RelayEnvelope {
  string request_id = 1;
  ComputeRequest request = 2;
}

message RelayReply {
  string request_id = 1;
  ComputeResponse response = 2;
  bytes node_id = 3;
}

message RelayComputeRequest {
  bytes target_node_id = 1;
  ComputeRequest request = 2;
}

service Relay {
  rpc Attach(stream RelayReply) returns (stream RelayEnvelope);
  rpc RelayCompute(RelayComputeRequest) returns (ComputeResponse);
}

message ClearSessionRequest {
  string session_id = 1;
}

message ClearSessionResponse {
  bool ok = 1;
}