syntax = "proto3";

package diffuse.gossip;

message PeerInfo {
  bytes node_id = 1;
  string daemon_endpoint = 2;
  string worker_endpoint = 3;
  string model_id = 4;
  uint32 start_layer = 5;
  uint32 end_layer = 6;
  uint64 last_seen_ms = 7;
  bytes signature = 8;
  bytes kx_public = 9;
  bool reachable = 10;
  uint32 total_layers = 11;
  uint32 protocol_version = 12;
}
message GossipRequest {
  bytes from_node_id = 1;
  repeated PeerInfo known_peers = 2;
}
message GossipResponse {
  repeated PeerInfo known_peers = 1;
}
message ReachabilityRequest {
  string compute_endpoint = 1;
}
message ReachabilityResponse {
  bool reachable = 2;
  string observed_address = 3;
}
service Gossip {
  rpc Exchange(GossipRequest) returns (GossipResponse);
  rpc CheckReachability(ReachabilityRequest) returns (ReachabilityResponse);
}