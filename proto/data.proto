syntax = "proto3";

package diffuse.data;

message Tensor {
  repeated int64 shape = 1;
  string dtype = 2;
  bytes data = 3;
}

message SliceRequest {
  string model_id = 1;
  uint32 start_layer = 2;
  uint32 end_layer = 3;
  string session_id = 4;
  uint64 position = 5;
  Tensor activations = 6;
  bool use_cache = 7;
  uint32 top_k = 8;
  bool accepts_bf16 = 9;
  Tensor position_ids = 10;
  Tensor encoder_memory = 11;
  uint64 patch_offset = 12;
  uint64 patch_sequence = 13;
  repeated DiffusionArgument arguments = 14;
  string branch = 15;
  string layout = 16;
}

message DiffusionArgument {
  uint32 index = 1;
  Tensor value = 2;
}

message SliceResponse {
  string session_id = 1;
  Tensor activations = 2;
  bool ok = 3;
  string error = 4;
}

message LoadSliceRequest {
  string model_id = 1;
  uint32 start_layer = 2;
  uint32 end_layer = 3;
  string hf_token = 4;
}

message LoadSliceResponse {
  bool ok = 1;
  string error = 2;
  uint32 total_layers = 3;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message EncodeRequest {
  string text = 1;
  bool apply_chat_template = 2;
  repeated ChatMessage messages = 3;
}

message EncodeResponse {
  repeated int64 token_ids = 1;
  bool ok = 2;
  string error = 3;
  int64 eos_token_id = 4;
}

message DecodeRequest {
  repeated int64 token_ids = 1;
  bool skip_special_tokens = 2;
}

message DecodeResponse {
  string text = 1;
  bool ok = 2;
  string error = 3;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  bool slice_loaded = 2;
  uint32 start_layer = 3;
  uint32 end_layer = 4;
}

message ProfileRequest {
  string model_id = 1;
  string hf_token = 2;
  double overhead_fraction = 3;
}

message ProfileResponse {
  bool ok = 1;
  string error = 2;
  uint32 total_layers = 3;
  uint64 avg_layer_bytes = 4;
  uint64 non_layer_bytes = 5;
  uint64 available_bytes = 6;
  uint32 max_layers = 7;
  uint32 max_layers_if_holding_embedding = 8;
  string device = 9;
}

message MediaAttachment {
  string kind = 1;
  bytes data = 2;
  string mime = 3;
}

message EmbedMediaRequest {
  string text = 1;
  repeated ChatMessage messages = 2;
  repeated MediaAttachment media = 3;
  bool apply_chat_template = 4;
  bool accepts_bf16 = 5;
}

message EmbedMediaResponse {
  bool ok = 1;
  string error = 2;
  Tensor embeddings = 3;
  uint32 token_count = 4;
  Tensor position_ids = 5;
}

message ModelCard {
  string id = 1;
  string architecture = 2;
  string model_type = 3;
  uint64 params = 4;
  uint64 downloads = 5;
  uint64 likes = 6;
  bool gated = 7;
  string support = 8;
  string note = 9;
  uint32 layers = 10;
  uint32 hidden_size = 11;
  repeated string inputs = 12;
  repeated string outputs = 13;
}

message SearchModelsRequest {
  string query = 1;
  uint32 limit = 2;
  string hf_token = 3;
  bool supported_only = 4;
}

message SearchModelsResponse {
  bool ok = 1;
  string error = 2;
  repeated ModelCard models = 3;
  uint64 available_bytes = 4;
  string device = 5;
  bool authenticated = 6;
  string account = 7;
}

message BeginGenerationRequest {
  string session_id = 1;
  string text = 2;
  repeated MediaAttachment media = 3;
  uint32 max_new_tokens = 4;
  bool accepts_bf16 = 5;
}

message BeginGenerationResponse {
  bool ok = 1;
  string error = 2;
  Tensor input_ids = 3;
  Tensor encoder_memory = 4;
  uint32 streams = 5;
  string output_kind = 6;
}

message AdvanceGenerationRequest {
  string session_id = 1;
  Tensor streams = 2;
}

message AdvanceGenerationResponse {
  bool ok = 1;
  string error = 2;
  Tensor input_ids = 3;
  bool finished = 4;
}

message FinishGenerationRequest {
  string session_id = 1;
}

message FinishGenerationResponse {
  bool ok = 1;
  string error = 2;
  bytes data = 3;
  string mime = 4;
  string text = 5;
}

message BeginDiffusionRequest {
  string session_id = 1;
  string model_id = 2;
  string prompt = 3;
  uint32 steps = 4;
  uint32 height = 5;
  uint32 width = 6;
  uint32 frames = 7;
  float guidance = 8;
  bool accepts_bf16 = 9;
  uint64 seed = 10;
}

message BeginDiffusionResponse {
  bool ok = 1;
  string error = 2;
  Tensor hidden = 3;
  repeated DiffusionArgument arguments = 4;
  string layout = 5;
  uint64 sequence = 6;
  uint32 blocks = 7;
  string output_kind = 8;
  string branch = 9;
}

message AdvanceDiffusionRequest {
  string session_id = 1;
  Tensor hidden = 2;
}

message AdvanceDiffusionResponse {
  bool ok = 1;
  string error = 2;
  bool finished = 3;
  Tensor hidden = 4;
  repeated DiffusionArgument arguments = 5;
  string layout = 6;
  uint64 sequence = 7;
  string branch = 8;
}

message FinishDiffusionRequest {
  string session_id = 1;
}

message FinishDiffusionResponse {
  bool ok = 1;
  string error = 2;
  bytes data = 3;
  string mime = 4;
}

message ClearSessionRequest {
  string session_id = 1;
}

message ClearSessionResponse {
  bool ok = 1;
}

service InferenceWorker {
  rpc LoadSlice(LoadSliceRequest) returns (LoadSliceResponse);
  rpc RunSlice(SliceRequest) returns (SliceResponse);
  rpc Encode(EncodeRequest) returns (EncodeResponse);
  rpc Decode(DecodeRequest) returns (DecodeResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc ProfileModel(ProfileRequest) returns (ProfileResponse);
  rpc ClearSession(ClearSessionRequest) returns (ClearSessionResponse);
  rpc SearchModels(SearchModelsRequest) returns (SearchModelsResponse);
  rpc EmbedMedia(EmbedMediaRequest) returns (EmbedMediaResponse);
  rpc BeginGeneration(BeginGenerationRequest) returns (BeginGenerationResponse);
  rpc AdvanceGeneration(AdvanceGenerationRequest) returns (AdvanceGenerationResponse);
  rpc FinishGeneration(FinishGenerationRequest) returns (FinishGenerationResponse);
  rpc BeginDiffusion(BeginDiffusionRequest) returns (BeginDiffusionResponse);
  rpc AdvanceDiffusion(AdvanceDiffusionRequest) returns (AdvanceDiffusionResponse);
  rpc FinishDiffusion(FinishDiffusionRequest) returns (FinishDiffusionResponse);
}