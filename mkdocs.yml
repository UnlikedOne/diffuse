site_name: Diffuse
site_description: Distributed peer-to-peer LLM inference where your prompt never leaves your device
site_url: https://unlikedone.github.io/diffuse/
repo_url: https://github.com/UnlikedOne/diffuse
repo_name: UnlikedOne/diffuse
edit_uri: edit/main/docs/
copyright: AGPL-3.0

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Privacy: PRIVACY.md
  - CLI: CLI.md
  - Benchmarks: BENCHMARKS.md
  - NAT relay design: nat-relay-design.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/UnlikedOne/diffuse